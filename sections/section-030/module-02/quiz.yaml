# Knowledge check for module 030-02. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
id: ats109-030-02
course_id: ATS109
exam_code: PERSES
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: section-030/module-02
  title: "Fix The Display Drift In api-latency"
placement:
  position: after
  reading: sections/section-030/module-02/course-05-summary.md
questions:
  - id: ats109-030-02-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Map the percentunit"
    source_readings:
      - sections/section-030/module-02/course-01-units-and-number-formats.md
    prompt: "Which Perses unit does the Grafana unit percentunit become?"
    options:
      - id: a
        text: "percent-decimal"
        explanation: "Correct. Both read a fraction of 1 as a percent."
      - id: b
        text: "percent"
        explanation: "Not correct. Percent expects values up to 100."
      - id: c
        text: "decimal"
        explanation: "Not correct. It shows a plain number."
      - id: d
        text: "none"
        explanation: "Not correct. It is not a Perses unit."
    correct_option: a
    explanation: "Correct. Both read a fraction of 1 as a percent."

  - id: ats109-030-02-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Map reqps"
    source_readings:
      - sections/section-030/module-02/course-01-units-and-number-formats.md
    prompt: "Which Perses unit does the Grafana unit reqps become?"
    options:
      - id: a
        text: "seconds"
        explanation: "Not correct. That is a duration."
      - id: b
        text: "requests/sec"
        explanation: "Correct. The migration maps reqps to it."
      - id: c
        text: "bytes"
        explanation: "Not correct. That is a size."
      - id: d
        text: "decimal"
        explanation: "Not correct. That is a plain number."
    correct_option: b
    explanation: "Correct. The migration maps reqps to it."

  - id: ats109-030-02-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know a dropped unit"
    source_readings:
      - sections/section-030/module-02/course-01-units-and-number-formats.md
    prompt: "What happens to a Grafana unit that is not in the mapping, such as kbytes?"
    options:
      - id: a
        text: "It becomes bytes."
        explanation: "Not correct. No guess is made."
      - id: b
        text: "The migration fails."
        explanation: "Not correct. It carries on."
      - id: c
        text: "The unit is dropped and the panel shows raw numbers."
        explanation: "Correct. No mapping exists, so nothing is written."
      - id: d
        text: "It becomes percent."
        explanation: "Not correct. No such rule exists."
    correct_option: c
    explanation: "Correct. No mapping exists, so nothing is written."

  - id: ats109-030-02-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write a limit in the panel unit"
    source_readings:
      - sections/section-030/module-02/course-03-thresholds-and-calculations.md
    prompt: "A panel turns red at five percent. Which step value is right with the unit percent-decimal?"
    options:
      - id: a
        text: "5"
        explanation: "Not correct. That is right only for the unit percent."
      - id: b
        text: "0.5"
        explanation: "Not correct. That is fifty percent."
      - id: c
        text: "500"
        explanation: "Not correct. That is far too high."
      - id: d
        text: "0.05"
        explanation: "Correct. The value is in the unit of the panel."
    correct_option: d
    explanation: "Correct. The value is in the unit of the panel."

  - id: ats109-030-02-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Write colours as hex"
    source_readings:
      - sections/section-030/module-02/course-03-thresholds-and-calculations.md
    prompt: "Why compare threshold colours as hex codes?"
    options:
      - id: a
        text: "A colour name can render in another shade in each tool."
        explanation: "Correct. The hex code is exact."
      - id: b
        text: "Hex codes are shorter."
        explanation: "Not correct. Accuracy is the reason."
      - id: c
        text: "Perses refuses names."
        explanation: "Not correct. A name may be accepted."
      - id: d
        text: "Grafana refuses hex."
        explanation: "Not correct. It accepts hex."
    correct_option: a
    explanation: "Correct. The hex code is exact."

  - id: ats109-030-02-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the base step"
    source_readings:
      - sections/section-030/module-02/course-03-thresholds-and-calculations.md
    prompt: "What does a Grafana base threshold step with value null become in Perses?"
    options:
      - id: a
        text: "It is dropped."
        explanation: "Not correct. The step is kept."
      - id: b
        text: "A step with the value 0."
        explanation: "Correct. The migration writes 0 for the base step."
      - id: c
        text: "A step with the value 100."
        explanation: "Not correct. It is the lowest step."
      - id: d
        text: "An error."
        explanation: "Not correct. The migration accepts it."
    correct_option: b
    explanation: "Correct. The migration writes 0 for the base step."

  - id: ats109-030-02-q07
    type: single_choice
    difficulty: beginner
    learning_objective: "Know the migrated duration"
    source_readings:
      - sections/section-030/module-02/course-04-time-range-step-and-refresh.md
    prompt: "Which duration does the migration write for every dashboard?"
    options:
      - id: a
        text: "The Grafana time range."
        explanation: "Not correct. It is not migrated."
      - id: b
        text: "24h"
        explanation: "Not correct. The fixed value is 1h."
      - id: c
        text: "1h"
        explanation: "Correct. The Grafana time range is not copied."
      - id: d
        text: "No duration."
        explanation: "Not correct. 1h is written."
    correct_option: c
    explanation: "Correct. The Grafana time range is not copied."

  - id: ats109-030-02-q08
    type: single_choice
    difficulty: beginner
    learning_objective: "Know the refresh"
    source_readings:
      - sections/section-030/module-02/course-04-time-range-step-and-refresh.md
    prompt: "What happens to the Grafana refresh interval in the migration?"
    options:
      - id: a
        text: "It is copied."
        explanation: "Not correct. It is not migrated."
      - id: b
        text: "It becomes the duration."
        explanation: "Not correct. They are separate."
      - id: c
        text: "It becomes a variable."
        explanation: "Not correct. No variable is made."
      - id: d
        text: "It is dropped."
        explanation: "Correct. Set refreshInterval yourself."
    correct_option: d
    explanation: "Correct. Set refreshInterval yourself."

  - id: ats109-030-02-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Map the legend"
    source_readings:
      - sections/section-030/module-02/course-02-legends-and-series-names.md
    prompt: "Which Perses field does the Grafana legendFormat become?"
    options:
      - id: a
        text: "seriesNameFormat"
        explanation: "Correct. The text with {{label}} names each series."
      - id: b
        text: "legend.position"
        explanation: "Not correct. It places the legend."
      - id: c
        text: "display.name"
        explanation: "Not correct. It names the panel."
      - id: d
        text: "minStep"
        explanation: "Not correct. It comes from interval."
    correct_option: a
    explanation: "Correct. The text with {{label}} names each series."

  - id: ats109-030-02-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the step effect"
    source_readings:
      - sections/section-030/module-02/course-04-time-range-step-and-refresh.md
    prompt: "What goes wrong when the step is longer than the window of a rate?"
    options:
      - id: a
        text: "The query fails."
        explanation: "Not correct. It still runs."
      - id: b
        text: "The line skips data between the points."
        explanation: "Correct. The rate has not seen the gaps."
      - id: c
        text: "The unit changes."
        explanation: "Not correct. Units are separate."
      - id: d
        text: "The panel turns red."
        explanation: "Not correct. Colours follow thresholds."
    correct_option: b
    explanation: "Correct. The rate has not seen the gaps."
