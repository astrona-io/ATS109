# Fix The Display Drift In api-latency
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-109-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm 3.22.1, percli and Perses v0.54.0, Prometheus and Grafana 12.4.13"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-109-lab-030-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-perses"
      description: "Waits until Perses and Grafana answer from the tester pod"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-dashboard-valid"
      description: "Confirms api-latency exists in the project parity, passes server validation and keeps four panels"
      type: "file"
      source: "validation/validate-dashboard-valid.sh"
    - name: "validate-units"
      description: "Confirms every panel unit is the Perses unit of the Grafana unit of the panel with the same title"
      type: "file"
      source: "validation/validate-units.sh"
    - name: "validate-thresholds"
      description: "Confirms the Error ratio thresholds are 0, 0.01 and 0.05 with the hex colours of green, orange and red"
      type: "file"
      source: "validation/validate-thresholds.sh"
    - name: "validate-time-range"
      description: "Confirms the duration and the refresh interval equal the Grafana time range and refresh"
      type: "file"
      source: "validation/validate-time-range.sh"
    - name: "validate-query-parity"
      description: "Confirms every panel query still returns the series of the Grafana query"
      type: "file"
      source: "validation/validate-query-parity.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - grafana/grafana:12.4.13
      - nicolaka/netshoot:v0.13
      - prom/prometheus:v3.15.1
