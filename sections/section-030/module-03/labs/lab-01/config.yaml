# Find And Fix The Panels That Differ
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-109-lab-030-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm 3.22.1, percli and Perses v0.54.0, Prometheus and Grafana 12.4.13"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-109-lab-030-03-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-perses"
      description: "Waits until Perses and Grafana answer from the tester pod"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-dashboard-valid"
      description: "Confirms service-health exists in the project release, passes server validation and keeps its five panels"
      type: "file"
      source: "validation/validate-dashboard-valid.sh"
    - name: "validate-query-parity"
      description: "Confirms every panel query returns the same series and values as the Grafana query of the panel with the same title"
      type: "file"
      source: "validation/validate-query-parity.sh"
    - name: "validate-parity-report"
      description: "Confirms the ConfigMap parity-report lists exactly the panels that differed"
      type: "file"
      source: "validation/validate-parity-report.sh"
    - name: "validate-grafana-unchanged"
      description: "Confirms the Grafana dashboard service-health was not changed"
      type: "file"
      source: "validation/validate-grafana-unchanged.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - grafana/grafana:12.4.13
      - nicolaka/netshoot:v0.13
      - prom/prometheus:v3.15.1
