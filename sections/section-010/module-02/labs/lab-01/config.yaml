# Build A Runtime Dashboard With Four Panel Plugins
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-109-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm 3.22.1, percli and Perses v0.54.0, Prometheus and Grafana 12.4.13"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-109-lab-010-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-perses"
      description: "Waits until Perses and Grafana answer from the tester pod"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-dashboard-valid"
      description: "Confirms runtime-panels exists in the project specs and passes server validation"
      type: "file"
      source: "validation/validate-dashboard-valid.sh"
    - name: "validate-panel-kinds"
      description: "Confirms the four panels use the right plugins and every layout item points at a panel"
      type: "file"
      source: "validation/validate-panel-kinds.sh"
    - name: "validate-units-and-calculations"
      description: "Confirms units, calculations, the gauge maximum and the gauge thresholds"
      type: "file"
      source: "validation/validate-units-and-calculations.sh"
    - name: "validate-query-results"
      description: "Confirms each panel query returns the same series as the expression in the task"
      type: "file"
      source: "validation/validate-query-results.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - grafana/grafana:12.4.13
      - nicolaka/netshoot:v0.13
      - prom/prometheus:v3.15.1
