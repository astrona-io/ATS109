# Group Migrated Panels Into Rows
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-109-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm 3.22.1, percli and Perses v0.54.0, Prometheus and Grafana 12.4.13"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-109-lab-020-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-perses"
      description: "Waits until Perses and Grafana answer from the tester pod"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-dashboard-valid"
      description: "Confirms overview-grouped exists in the project legacy and passes server validation"
      type: "file"
      source: "validation/validate-dashboard-valid.sh"
    - name: "validate-layout-groups"
      description: "Confirms the groups Summary, Details and Internals hold the right panels, each panel is placed once and Internals starts closed"
      type: "file"
      source: "validation/validate-layout-groups.sh"
    - name: "validate-variables"
      description: "Confirms the variable filter is gone, job, handler and interval are kept and every variable a query uses is defined"
      type: "file"
      source: "validation/validate-variables.sh"
    - name: "validate-panels-unchanged"
      description: "Confirms the eight panels keep their titles, plugins and queries from overview-flat"
      type: "file"
      source: "validation/validate-panels-unchanged.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - grafana/grafana:12.4.13
      - nicolaka/netshoot:v0.13
      - prom/prometheus:v3.15.1
