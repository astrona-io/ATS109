# Migrate A Shared Dashboard Export
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-109-capstone-020"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm 3.22.1, percli and Perses v0.54.0, Prometheus and Grafana 12.4.13"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-109-capstone-020-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-perses"
      description: "Waits until Perses and Grafana answer from the tester pod"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-dashboard-migrated"
      description: "Confirms http-overview exists in the project shared and passes server validation"
      type: "file"
      source: "validation/validate-dashboard-migrated.sh"
    - name: "validate-no-input-placeholders"
      description: "Confirms no query or variable still names ${DS_PROMETHEUS} and no placeholder is left"
      type: "file"
      source: "validation/validate-no-input-placeholders.sh"
    - name: "validate-row-kept"
      description: "Confirms the collapsed row Details became its own closed Grid group with two panels"
      type: "file"
      source: "validation/validate-row-kept.sh"
    - name: "validate-custom-resource"
      description: "Confirms the ConfigMap http-overview-cr holds a PersesDashboard for the namespace shared"
      type: "file"
      source: "validation/validate-custom-resource.sh"

teardown:
  keepCluster: false
